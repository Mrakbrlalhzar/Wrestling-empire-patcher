name: Smart Suggestions and Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify existing files
        run: |
          set -e
          for f in Theme.kt SaveModel.kt SaveParser.kt SavePatcher.kt SaveSession.kt SaveViewModel.kt MainActivity.kt; do
            test -s app/src/main/java/com/example/savetool/$f || (echo "MISSING: $f" && exit 1)
            echo "✓ $f"
          done

      - name: Patch SaveParser to include health and spirit
        run: |
          set -e
          P=app/src/main/java/com/example/savetool/SaveParser.kt
          echo "=== Current extraFieldNames line ==="
          grep -n "extraFieldNames" "$P" || true
          # Replace the list to include health and spirit
          sed -i 's/val extraFieldNames = listOf("age", "height", "armMass", "muscleMass", "bodyMass", "legMass")/val extraFieldNames = listOf("age", "height", "armMass", "muscleMass", "bodyMass", "legMass", "health", "spirit")/' "$P"
          echo "=== After patch ==="
          grep -n "extraFieldNames" "$P" || true
          grep -q '"health"' "$P" || (echo "✗ health not added" && exit 1)
          grep -q '"spirit"' "$P" || (echo "✗ spirit not added" && exit 1)
          echo "✓ health and spirit added"

      - name: Write MainActivity.kt
        run: |
          cat > app/src/main/java/com/example/savetool/MainActivity.kt << 'EOF'
          package com.example.savetool
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.viewmodel.compose.viewModel
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          // ============ Smart suggestion helpers ============
          fun fieldKeyFromLabel(label: String): String =
              if (label.startsWith("stat[")) "stat" else label

          fun suggestionsFor(fieldKey: String): List<Float> = when (fieldKey) {
              "stat" -> listOf(110f, -1000f)
              "height" -> listOf(1.22f)
              "armMass", "muscleMass" -> listOf(110f)
              "legMass", "bodyMass" -> listOf(-110f)
              else -> emptyList()
          }

          fun warningFor(fieldKey: String): String? = when (fieldKey) {
              "stat" -> "Values above ±1000 not recommended"
              "height" -> "Heights above 1.4 not recommended"
              else -> null
          }

          val EXTRA_FIELD_ORDER = listOf("age", "height", "armMass", "muscleMass", "bodyMass", "legMass", "health", "spirit")

          // ============ Activity ============
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { SaveEditorTheme { SaveEditorApp() } }
              }
          }

          class WriteOpenDocument : ActivityResultContracts.OpenDocument() {
              override fun createIntent(context: Context, input: Array<String>): Intent {
                  return super.createIntent(context, input).apply {
                      addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun SaveEditorApp(vm: SaveViewModel = viewModel()) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var selectedCharIndex by remember { mutableStateOf<Int?>(null) }
              var showAbout by remember { mutableStateOf(false) }
              var sourceUri by remember { mutableStateOf<Uri?>(null) }

              BackHandler(enabled = selectedCharIndex != null) { selectedCharIndex = null }

              val openLauncher = rememberLauncherForActivityResult(WriteOpenDocument()) { uri ->
                  if (uri != null) {
                      try {
                          context.contentResolver.takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          )
                      } catch (_: Exception) { }
                      sourceUri = uri
                      selectedCharIndex = null
                      vm.load(uri, context)
                  }
              }
              val saveAsLauncher = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("application/octet-stream")) { uri ->
                  if (uri != null) {
                      val bytes = vm.buildBytes()
                      if (bytes != null) {
                          val changeCount = vm.editsCount()
                          scope.launch {
                              val success = withContext(Dispatchers.IO) {
                                  try {
                                      context.contentResolver.openOutputStream(uri, "wt")?.use { it.write(bytes) }
                                      true
                                  } catch (e: Exception) { false }
                              }
                              if (success) {
                                  Toast.makeText(context, "✓ Saved ($changeCount changes)", Toast.LENGTH_LONG).show()
                                  sourceUri = uri
                                  vm.load(uri, context)
                              } else {
                                  Toast.makeText(context, "Save failed", Toast.LENGTH_LONG).show()
                              }
                          }
                      }
                  }
              }
              val performSave: () -> Unit = {
                  val bytes = vm.buildBytes()
                  val changeCount = vm.editsCount()
                  val target = sourceUri
                  if (bytes == null || changeCount == 0) {
                      // nothing to save
                  } else if (target == null) {
                      saveAsLauncher.launch("Save.bytes.patched")
                  } else {
                      scope.launch {
                          val success = withContext(Dispatchers.IO) {
                              try {
                                  context.contentResolver.openOutputStream(target, "wt")?.use { it.write(bytes) }
                                  true
                              } catch (e: Exception) { false }
                          }
                          if (success) {
                              Toast.makeText(context, "✓ Overwritten ($changeCount changes)", Toast.LENGTH_LONG).show()
                              vm.load(target, context)
                          } else {
                              Toast.makeText(context, "Cannot write to original. Use Save As.", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              val characters = vm.session?.document?.characters.orEmpty()
              val selectedChar = selectedCharIndex?.let { idx -> characters.firstOrNull { it.arrayIndex == idx } }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surface, titleContentColor = MaterialTheme.colorScheme.primary),
                          title = { Text(selectedChar?.name?.ifEmpty { "Unnamed" } ?: "Save Editor", fontWeight = FontWeight.Bold) },
                          navigationIcon = {
                              if (selectedChar != null) IconButton(onClick = { selectedCharIndex = null }) { Text("←", style = MaterialTheme.typography.headlineSmall) }
                          },
                          actions = { IconButton(onClick = { showAbout = true }) { Text("ℹ️", style = MaterialTheme.typography.titleLarge) } }
                      )
                  },
                  bottomBar = {
                      if (vm.session != null) {
                          BottomAppBar(containerColor = MaterialTheme.colorScheme.surface) {
                              Row(Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Text("${vm.editsCount()} changes", Modifier.weight(1f), color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  TextButton(onClick = { if (vm.editsCount() > 0) saveAsLauncher.launch("Save.bytes.patched") }, enabled = vm.editsCount() > 0) { Text("Save As") }
                                  Spacer(Modifier.width(4.dp))
                                  Button(onClick = performSave, enabled = vm.editsCount() > 0, shape = RoundedCornerShape(12.dp)) { Text("💾 Save") }
                              }
                          }
                      }
                  }
              ) { padding ->
                  Box(Modifier.padding(padding).fillMaxSize()) {
                      when {
                          vm.isLoading -> Column(Modifier.align(Alignment.Center), horizontalAlignment = Alignment.CenterHorizontally) {
                              CircularProgressIndicator(); Spacer(Modifier.height(16.dp)); Text("Loading file...")
                          }
                          vm.error != null -> Column(Modifier.align(Alignment.Center).padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("Error", style = MaterialTheme.typography.titleLarge); Spacer(Modifier.height(8.dp))
                              Text(vm.error!!, style = MaterialTheme.typography.bodyMedium); Spacer(Modifier.height(16.dp))
                              Button(onClick = { openLauncher.launch(arrayOf("*/*")) }) { Text("Pick another file") }
                          }
                          vm.session == null -> Column(Modifier.align(Alignment.Center).padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("❤", style = MaterialTheme.typography.displayLarge, color = MaterialTheme.colorScheme.primary)
                              Spacer(Modifier.height(16.dp)); Text("Select a Save.bytes file", style = MaterialTheme.typography.titleMedium)
                              Spacer(Modifier.height(20.dp))
                              Button(onClick = { openLauncher.launch(arrayOf("*/*")) }, shape = RoundedCornerShape(12.dp)) { Text("📂 Pick file") }
                          }
                          selectedChar != null -> CharacterDetailScreen(vm = vm, char = selectedChar)
                          else -> CharacterListScreen(vm = vm, characters = characters, onSelect = { selectedCharIndex = it.arrayIndex })
                      }
                  }
              }
              if (showAbout) AboutDialog(onDismiss = { showAbout = false })
          }

          @Composable
          fun AboutDialog(onDismiss: () -> Unit) {
              val context = LocalContext.current
              AlertDialog(
                  onDismissRequest = onDismiss,
                  icon = { Text("❤", style = MaterialTheme.typography.displaySmall, color = MaterialTheme.colorScheme.primary) },
                  title = { Text("About") },
                  text = {
                      Column(Modifier.heightIn(max = 480.dp).verticalScroll(rememberScrollState())) {
                          Text("It's made with ♥ in Iran", style = MaterialTheme.typography.titleMedium, color = MaterialTheme.colorScheme.primary)
                          Spacer(Modifier.height(16.dp))
                          Text("Made by", style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          Spacer(Modifier.height(6.dp))
                          Text("Mrakbrlalhzar",
                              modifier = Modifier.clickable {
                                  try { context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://github.com/Mrakbrlalhzar"))) } catch (_: Exception) {}
                              },
                              style = MaterialTheme.typography.titleLarge, color = MaterialTheme.colorScheme.secondary, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(4.dp))
                          Text("github.com/Mrakbrlalhzar", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          Spacer(Modifier.height(18.dp))
                          Box(Modifier.fillMaxWidth().height(1.dp).background(MaterialTheme.colorScheme.outline))
                          Spacer(Modifier.height(14.dp))
                          Text("📖 Step-by-step guide", style = MaterialTheme.typography.titleSmall, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(10.dp))
                          GuideStep("1.", "Tap 📂 Pick file and select Save.bytes")
                          GuideStep("2.", "Tap a character to edit their stats one by one")
                          GuideStep("3.", "Or use checkboxes + ⚡ Bulk edit to edit many at once")
                          GuideStep("4.", "Tap 💾 Save to overwrite the original file, or Save As for a copy")
                          GuideStep("5.", "Reopen the file in-game and check your changes")
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }
              )
          }

          @Composable
          fun GuideStep(num: String, text: String) {
              Row(Modifier.padding(vertical = 3.dp)) {
                  Text(num, style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.secondary, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.width(8.dp))
                  Text(text, style = MaterialTheme.typography.bodyMedium)
              }
          }

          @Composable
          fun CharacterListScreen(vm: SaveViewModel, characters: List<Character>, onSelect: (Character) -> Unit) {
              var searchQuery by remember { mutableStateOf("") }
              var showBulkDialog by remember { mutableStateOf(false) }
              val filtered = remember(characters, searchQuery) {
                  if (searchQuery.isBlank()) characters else characters.filter { it.name.contains(searchQuery, ignoreCase = true) }
              }
              val visibleIndices = remember(filtered) { filtered.map { it.arrayIndex }.toSet() }
              Column(Modifier.fillMaxSize()) {
                  OutlinedTextField(value = searchQuery, onValueChange = { searchQuery = it },
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),
                      label = { Text("🔍 Search by name") }, singleLine = true, shape = RoundedCornerShape(14.dp))
                  Row(Modifier.fillMaxWidth().padding(horizontal = 12.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      FilledTonalButton(onClick = { vm.selectAllVisible(visibleIndices) }, modifier = Modifier.weight(1f), shape = RoundedCornerShape(12.dp)) {
                          Text("✓ All", style = MaterialTheme.typography.bodyMedium)
                      }
                      FilledTonalButton(onClick = { vm.invertVisible(visibleIndices) }, modifier = Modifier.weight(1f), shape = RoundedCornerShape(12.dp)) {
                          Text("⇄ Invert", style = MaterialTheme.typography.bodyMedium)
                      }
                      if (vm.selectedIndices.isNotEmpty()) {
                          FilledTonalButton(onClick = { vm.clearSelection() }, modifier = Modifier.weight(1f), shape = RoundedCornerShape(12.dp),
                              colors = ButtonDefaults.filledTonalButtonColors(containerColor = MaterialTheme.colorScheme.error, contentColor = MaterialTheme.colorScheme.onError)) {
                              Text("✕ ${vm.selectedIndices.size}", style = MaterialTheme.typography.bodyMedium)
                          }
                      }
                  }
                  if (vm.selectedIndices.isNotEmpty()) {
                      Spacer(Modifier.height(8.dp))
                      Button(onClick = { showBulkDialog = true },
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp), shape = RoundedCornerShape(12.dp)) {
                          Text("⚡ ${vm.selectedIndices.size} selected → Bulk edit", fontWeight = FontWeight.Bold)
                      }
                  }
                  Text("${filtered.size} of ${characters.size} characters", Modifier.padding(horizontal = 16.dp, vertical = 10.dp),
                      style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  if (filtered.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text(if (characters.isEmpty()) "No characters found" else "No search results", color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  } else {
                      LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(horizontal = 12.dp, vertical = 4.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          items(filtered, key = { it.arrayIndex }) { char ->
                              CharacterCard(char = char, isSelected = char.arrayIndex in vm.selectedIndices,
                                  onToggleSelect = { vm.toggleSelection(char.arrayIndex) }, onClick = { onSelect(char) })
                          }
                      }
                  }
              }
              if (showBulkDialog) {
                  BulkEditDialog(count = vm.selectedIndices.size, onDismiss = { showBulkDialog = false },
                      onConfirm = { change -> vm.applyBulkChangeToSelected(change); showBulkDialog = false })
              }
          }

          @Composable
          fun CharacterCard(char: Character, isSelected: Boolean, onToggleSelect: () -> Unit, onClick: () -> Unit) {
              Card(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp),
                  colors = CardDefaults.cardColors(containerColor = if (isSelected) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surfaceVariant),
                  elevation = CardDefaults.cardElevation(defaultElevation = 2.dp)) {
                  Row(Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                      Checkbox(checked = isSelected, onCheckedChange = { onToggleSelect() })
                      Column(Modifier.weight(1f).clickable { onClick() }.padding(vertical = 8.dp, horizontal = 6.dp)) {
                          Text(char.name.ifEmpty { "(Unnamed)" }, style = MaterialTheme.typography.titleMedium,
                              color = if (isSelected) MaterialTheme.colorScheme.onPrimaryContainer else MaterialTheme.colorScheme.onSurface,
                              fontWeight = FontWeight.SemiBold)
                          Spacer(Modifier.height(2.dp))
                          Text("${char.stats.size} stats — #${char.arrayIndex}", style = MaterialTheme.typography.bodySmall,
                              color = if (isSelected) MaterialTheme.colorScheme.onPrimaryContainer else MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      Text("›", style = MaterialTheme.typography.headlineSmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }

          // ============ Field input with suggestions ============
          @Composable
          fun FieldInput(
              label: String,
              value: String,
              onValueChange: (String) -> Unit,
              suggestions: List<Float>,
              warning: String?
          ) {
              Column(Modifier.padding(bottom = 8.dp)) {
                  OutlinedTextField(
                      value = value,
                      onValueChange = onValueChange,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                      singleLine = true,
                      shape = RoundedCornerShape(12.dp),
                      label = { Text(label) },
                      modifier = Modifier.fillMaxWidth()
                  )
                  if (suggestions.isNotEmpty()) {
                      Spacer(Modifier.height(4.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                          suggestions.forEach { s ->
                              FilledTonalButton(
                                  onClick = { onValueChange(s.toString()) },
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp)
                              ) { Text(s.toString(), style = MaterialTheme.typography.bodySmall) }
                          }
                      }
                  }
                  if (warning != null) {
                      Spacer(Modifier.height(2.dp))
                      Text("⚠️ $warning", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }

          // ============ Bulk edit dialog ============
          @Composable
          fun BulkEditDialog(count: Int, onDismiss: () -> Unit, onConfirm: (BulkChange) -> Unit) {
              var statsText by remember { mutableStateOf("110") }
              var applyStats by remember { mutableStateOf(true) }
              val extraTexts = remember {
                  mutableStateMapOf<String, String>().apply { EXTRA_FIELD_ORDER.forEach { this[it] = "" } }
              }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("Bulk edit $count characters") },
                  text = {
                      Column(Modifier.height(520.dp).verticalScroll(rememberScrollState())) {
                          Text("Stats:", style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Checkbox(checked = applyStats, onCheckedChange = { applyStats = it })
                              Text("Apply to stats", style = MaterialTheme.typography.bodyMedium)
                          }
                          if (applyStats) {
                              OutlinedTextField(
                                  value = statsText,
                                  onValueChange = { statsText = it },
                                  keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                                  singleLine = true,
                                  shape = RoundedCornerShape(12.dp),
                                  label = { Text("Stat value") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                              Spacer(Modifier.height(4.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                                  suggestionsFor("stat").forEach { s ->
                                      FilledTonalButton(
                                          onClick = { statsText = s.toString() },
                                          contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp)
                                      ) { Text(s.toString(), style = MaterialTheme.typography.bodySmall) }
                                  }
                              }
                              Spacer(Modifier.height(2.dp))
                              Text("⚠️ ${warningFor("stat")}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                          Spacer(Modifier.height(16.dp))
                          Text("Extra fields (empty = unchanged):", style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(6.dp))
                          EXTRA_FIELD_ORDER.forEach { field ->
                              FieldInput(
                                  label = field,
                                  value = extraTexts[field] ?: "",
                                  onValueChange = { extraTexts[field] = it },
                                  suggestions = suggestionsFor(field),
                                  warning = warningFor(field)
                              )
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          val statsVal = if (applyStats) statsText.replace(',', '.').toFloatOrNull() else null
                          val extras = mutableMapOf<String, Float>()
                          extraTexts.forEach { (k, v) ->
                              v.replace(',', '.').toFloatOrNull()?.let { extras[k] = it }
                          }
                          onConfirm(BulkChange(statsVal, extras))
                      }) { Text("Apply") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Cancel") } }
              )
          }

          // ============ Character detail ============
          @Composable
          fun CharacterDetailScreen(vm: SaveViewModel, char: Character) {
              Column(Modifier.fillMaxSize()) {
                  SetAllStatsCard(onSet = { value -> vm.setCharacterStats(char, value) })
                  LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(horizontal = 8.dp, vertical = 4.dp)) {
                      if (char.extraFields.isNotEmpty()) {
                          item {
                              Text("📊 Attributes", Modifier.padding(horizontal = 12.dp, vertical = 8.dp),
                                  style = MaterialTheme.typography.titleSmall, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                          }
                          items(char.extraFields) { f -> EditableRow(vm, f, label = f.name) }
                      }
                      if (char.stats.isNotEmpty()) {
                          item {
                              Text("💪 Stats (${char.stats.size})", Modifier.padding(horizontal = 12.dp, vertical = 8.dp),
                                  style = MaterialTheme.typography.titleSmall, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                          }
                          items(char.stats) { slot -> EditableRow(vm, slot, label = "stat[${slot.index}]") }
                      }
                  }
              }
          }

          @Composable
          fun SetAllStatsCard(onSet: (Float) -> Unit) {
              var text by remember { mutableStateOf("110") }
              val parsed = text.replace(',', '.').toFloatOrNull()
              Card(
                  modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),
                  shape = RoundedCornerShape(14.dp),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)
              ) {
                  Column(Modifier.padding(12.dp)) {
                      Text("Set all stats to:", style = MaterialTheme.typography.titleSmall,
                          color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(6.dp))
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(
                              value = text,
                              onValueChange = { text = it },
                              modifier = Modifier.weight(1f),
                              singleLine = true,
                              label = { Text("Value") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Button(onClick = { parsed?.let(onSet) }, enabled = parsed != null, shape = RoundedCornerShape(12.dp)) { Text("Set") }
                      }
                      Spacer(Modifier.height(6.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          suggestionsFor("stat").forEach { s ->
                              FilledTonalButton(
                                  onClick = { text = s.toString() },
                                  contentPadding = PaddingValues(horizontal = 12.dp, vertical = 2.dp)
                              ) { Text(s.toString(), style = MaterialTheme.typography.bodySmall) }
                          }
                      }
                      Spacer(Modifier.height(4.dp))
                      Text("⚠️ ${warningFor("stat")}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }

          @Composable
          fun EditableRow(vm: SaveViewModel, e: Editable, label: String) {
              var dialogOpen by remember { mutableStateOf(false) }
              val currentValue = vm.currentValueOf(e)
              Card(modifier = Modifier.fillMaxWidth().padding(horizontal = 4.dp, vertical = 3.dp), shape = RoundedCornerShape(10.dp),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)) {
                  Row(Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                      Text(label, Modifier.weight(1f), style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.SemiBold)
                      Text(formatValue(currentValue, e.type), Modifier.width(90.dp), style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.secondary)
                      TextButton(onClick = { dialogOpen = true }, contentPadding = PaddingValues(horizontal = 10.dp, vertical = 4.dp)) { Text("Edit") }
                  }
              }
              if (dialogOpen) {
                  EditStatDialog(currentValue = currentValue, type = e.type, label = label,
                      onDismiss = { dialogOpen = false }, onConfirm = { v -> vm.setValue(e, v); dialogOpen = false })
              }
          }

          @Composable
          fun EditStatDialog(
              currentValue: Float,
              type: PrimTypeEnum,
              label: String,
              onDismiss: () -> Unit,
              onConfirm: (Float) -> Unit
          ) {
              val fieldKey = fieldKeyFromLabel(label)
              val suggestions = suggestionsFor(fieldKey)
              val warning = warningFor(fieldKey)
              var text by remember { mutableStateOf(formatValue(currentValue, type)) }
              val parsed = text.replace(',', '.').toFloatOrNull()

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("Edit $label") },
                  text = {
                      Column {
                          Text("Current: ${formatValue(currentValue, type)}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          Spacer(Modifier.height(10.dp))
                          OutlinedTextField(
                              value = text,
                              onValueChange = { text = it },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              isError = parsed == null,
                              singleLine = true,
                              shape = RoundedCornerShape(12.dp),
                              label = { Text("New value") },
                              modifier = Modifier.fillMaxWidth()
                          )
                          if (suggestions.isNotEmpty()) {
                              Spacer(Modifier.height(8.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  suggestions.forEach { s ->
                                      FilledTonalButton(
                                          onClick = { text = s.toString() },
                                          contentPadding = PaddingValues(horizontal = 12.dp, vertical = 2.dp)
                                      ) { Text(s.toString(), style = MaterialTheme.typography.bodySmall) }
                                  }
                              }
                          }
                          if (warning != null) {
                              Spacer(Modifier.height(6.dp))
                              Text("⚠️ $warning", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      }
                  },
                  confirmButton = { TextButton(onClick = { parsed?.let(onConfirm) }, enabled = parsed != null) { Text("OK") } },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Cancel") } }
              )
          }
          EOF

      - name: Verify changes
        run: |
          set -e
          F=app/src/main/java/com/example/savetool/MainActivity.kt
          grep -q "suggestionsFor" "$F" && echo "✓ suggestionsFor present"
          grep -q "warningFor" "$F" && echo "✓ warningFor present"
          grep -q "SetAllStatsCard" "$F" && echo "✓ SetAllStatsCard present"
          grep -q "FieldInput" "$F" && echo "✓ FieldInput present"
          grep -q "Values above ±1000 not recommended" "$F" && echo "✓ stat warning"
          grep -q "Heights above 1.4 not recommended" "$F" && echo "✓ height warning"
          # verify old buttons are gone
          if grep -q "All stats → -1000.0" "$F"; then echo "✗ old 'All stats' button still present"; exit 1; fi
          if grep -q "All stats of this character → 1000.0" "$F"; then echo "✗ old 'Set 1000' button still present"; exit 1; fi
          if grep -q "99999" "$F"; then echo "✗ old quick values still present"; exit 1; fi
          echo "✓ All checks passed"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew clean :app:assembleDebug --no-build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: save-editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and Push (always)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: smart suggestions + health/spirit + remove old buttons [skip-ci]"
          git push
