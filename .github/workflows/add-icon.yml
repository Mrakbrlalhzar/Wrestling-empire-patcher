name: Add App Icon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rsvg-convert
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - name: Create icon SVG
        run: |
          mkdir -p /tmp/assets
          cat > /tmp/assets/ic_launcher.svg << 'SVG_EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <radialGradient id="bg" cx="50%" cy="40%" r="70%">
                <stop offset="0%" stop-color="#1e2530"/>
                <stop offset="100%" stop-color="#0a0d12"/>
              </radialGradient>
              <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE082"/>
                <stop offset="50%" stop-color="#FFC857"/>
                <stop offset="100%" stop-color="#B8860B"/>
              </linearGradient>
              <linearGradient id="turq" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#80DEEA"/>
                <stop offset="100%" stop-color="#26A69A"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="110" fill="url(#bg)"/>
            <path d="M256 60 L430 160 L430 360 L256 460 L82 360 L82 160 Z"
                  fill="none" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
            <path d="M256 90 L404 176 L404 344 L256 430 L108 344 L108 176 Z"
                  fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.35"/>
            <path d="M290 110 L210 265 L260 265 L230 400 L335 245 L285 245 L315 110 Z"
                  fill="url(#gold)" stroke="#8B6914" stroke-width="3" stroke-linejoin="round"/>
            <path d="M395 118 L402 136 L420 143 L402 150 L395 168 L388 150 L370 143 L388 136 Z"
                  fill="url(#turq)"/>
            <path d="M130 370 L135 382 L147 387 L135 392 L130 404 L125 392 L113 387 L125 382 Z"
                  fill="url(#gold)" opacity="0.85"/>
          </svg>
          SVG_EOF

      - name: Generate PNG icons at all densities
        run: |
          for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${pair%%:*}"
            size="${pair##*:}"
            target_dir="app/src/main/res/mipmap-$density"
            mkdir -p "$target_dir"
            rsvg-convert -w "$size" -h "$size" /tmp/assets/ic_launcher.svg -o "$target_dir/ic_launcher.png"
            cp "$target_dir/ic_launcher.png" "$target_dir/ic_launcher_round.png"
            echo "✓ $density ($size x $size)"
          done

      - name: Create adaptive icon XMLs and vectors
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26

          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0E1116"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:strokeColor="#FFC857"
                  android:strokeWidth="2.5"
                  android:strokeLineJoin="round"
                  android:fillColor="#00000000"
                  android:pathData="M84,54 L69,28 L39,28 L24,54 L39,80 L69,80 Z"/>
              <path
                  android:fillColor="#FFC857"
                  android:strokeColor="#8B6914"
                  android:strokeWidth="0.8"
                  android:strokeLineJoin="round"
                  android:pathData="M61,32 L46,52 L53,52 L50,76 L66,52 L58,52 L63,32 Z"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Update AndroidManifest with new icon
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Save Editor"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Verify icon files
        run: |
          set -e
          for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${pair%%:*}"
            f="app/src/main/res/mipmap-$density/ic_launcher.png"
            test -s "$f" || (echo "MISSING $f" && exit 1)
            echo "✓ $f ($(stat -c%s "$f") bytes)"
          done
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml && echo "✓ adaptive icon XML"
          test -s app/src/main/res/drawable/ic_launcher_foreground.xml && echo "✓ foreground vector"
          test -s app/src/main/res/drawable/ic_launcher_background.xml && echo "✓ background vector"
          grep -q "ic_launcher" app/src/main/AndroidManifest.xml && echo "✓ manifest references icon"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew clean :app:assembleDebug --no-build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: save-editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and Push (always)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: custom app icon (gold lightning + turquoise sparkles) [skip ci]"
          git push
