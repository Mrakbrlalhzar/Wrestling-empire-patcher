name: Scaffold Project Structure

on:
  workflow_dispatch:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Directory Structure and Placeholder Files
        run: |
          set -e

          # پوشه‌های اصلی
          mkdir -p .github/workflows
          mkdir -p app/src/main/java/com/example/savetool
          mkdir -p gradle/wrapper

          # فایل‌های خالی (اگر وجود نداشته باشن)
          [ -f app/build.gradle.kts ] || touch app/build.gradle.kts
          [ -f app/src/main/AndroidManifest.xml ] || touch app/src/main/AndroidManifest.xml
          [ -f app/src/main/java/com/example/savetool/MainActivity.kt ] || touch app/src/main/java/com/example/savetool/MainActivity.kt
          [ -f app/src/main/java/com/example/savetool/SaveModel.kt ] || touch app/src/main/java/com/example/savetool/SaveModel.kt
          [ -f app/src/main/java/com/example/savetool/SaveParser.kt ] || touch app/src/main/java/com/example/savetool/SaveParser.kt
          [ -f app/src/main/java/com/example/savetool/SavePatcher.kt ] || touch app/src/main/java/com/example/savetool/SavePatcher.kt
          [ -f app/src/main/java/com/example/savetool/SaveSession.kt ] || touch app/src/main/java/com/example/savetool/SaveSession.kt
          [ -f build.gradle.kts ] || touch build.gradle.kts
          [ -f settings.gradle.kts ] || touch settings.gradle.kts
          [ -f gradle.properties ] || touch gradle.properties
          [ -f gradlew ] || touch gradlew
          [ -f gradlew.bat ] || touch gradlew.bat
          [ -f gradle/wrapper/gradle-wrapper.properties ] || touch gradle/wrapper/gradle-wrapper.properties

          # فایل jar رو نمی‌شه با touch ساخت؛ باید از گریدل بگیریم
          # توی YAML بعدی با gradle wrapper حلش می‌کنیم

      - name: Commit Scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: scaffold project structure"
          git push
