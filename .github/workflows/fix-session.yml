name: Fix SaveSession and Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose current SaveSession.kt
        run: |
          echo "=== SaveSession.kt content (before overwrite) ==="
          cat app/src/main/java/com/example/savetool/SaveSession.kt || echo "FILE NOT FOUND"
          echo "=== END ==="

      - name: Write SaveSession.kt
        run: |
          cat > app/src/main/java/com/example/savetool/SaveSession.kt << 'EOF'
          package com.example.savetool

          class SaveSession private constructor(
              val originalBytes: ByteArray,
              val document: SaveDocument
          ) {
              private val edits = LinkedHashMap<Int, StatEdit>()

              fun setValue(e: Editable, newValue: Float) {
                  edits[e.offset] = StatEdit(e.offset, e.length, e.type, newValue)
              }

              fun setAllStatsOf(char: Character, newValue: Float) =
                  char.stats.forEach { setValue(it, newValue) }

              fun setAllStatsOfEveryone(newValue: Float) =
                  document.characters.forEach { c -> c.stats.forEach { setValue(it, newValue) } }

              fun currentValueOf(e: Editable): Float =
                  edits[e.offset]?.newValue ?: e.value

              fun editsCount(): Int = edits.size

              fun clearEdits() = edits.clear()

              fun buildPatchedBytes(): ByteArray =
                  SavePatcher.apply(originalBytes, edits.values.toList())

              companion object {
                  fun load(saveBytes: ByteArray): SaveSession {
                      val parser = SaveParser(saveBytes)
                      val root = parser.parse()
                      val doc = parser.extract(root)
                      return SaveSession(saveBytes, doc)
                  }
              }
          }
          EOF

      - name: Verify SaveSession.kt content (after overwrite)
        run: |
          echo "=== SaveSession.kt content (after) ==="
          cat app/src/main/java/com/example/savetool/SaveSession.kt
          echo "=== END ==="
          grep -q "setAllStatsOfEveryone" app/src/main/java/com/example/savetool/SaveSession.kt && echo "✓ setAllStatsOfEveryone found" || (echo "✗ setAllStatsOfEveryone MISSING" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -s gradlew ]; then
            echo "Generating wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Clean and Build Debug APK
        run: ./gradlew clean :app:assembleDebug --no-build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: save-editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: rewrite SaveSession with setAllStatsOfEveryone [skip ci]"
          git push
