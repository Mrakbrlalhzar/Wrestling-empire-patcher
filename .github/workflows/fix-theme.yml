name: Fix Theme and Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List Kotlin files (diagnostic)
        run: |
          echo "=== .kt files present ==="
          find app/src/main/java -name "*.kt" | sort || true

      - name: Write Theme.kt
        run: |
          cat > app/src/main/java/com/example/savetool/Theme.kt << 'EOF'
          package com.example.savetool

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          private val PersianDark = darkColorScheme(
              primary = Color(0xFFFFC857),
              onPrimary = Color(0xFF2B1F00),
              primaryContainer = Color(0xFF5A4600),
              onPrimaryContainer = Color(0xFFFFE9A8),
              secondary = Color(0xFF4DD0E1),
              onSecondary = Color(0xFF00363D),
              secondaryContainer = Color(0xFF004F57),
              onSecondaryContainer = Color(0xFF9EEFF9),
              tertiary = Color(0xFFCE93D8),
              onTertiary = Color(0xFF3E1D47),
              tertiaryContainer = Color(0xFF57305F),
              onTertiaryContainer = Color(0xFFF2C7FA),
              background = Color(0xFF0E1116),
              onBackground = Color(0xFFE3E5E8),
              surface = Color(0xFF151A21),
              onSurface = Color(0xFFE3E5E8),
              surfaceVariant = Color(0xFF232A33),
              onSurfaceVariant = Color(0xFFC1C7CE),
              error = Color(0xFFFF6B6B),
              onError = Color(0xFF4D0000),
              outline = Color(0xFF4A5360)
          )

          @Composable
          fun SaveEditorTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = PersianDark,
                  content = content
              )
          }
          EOF

      - name: Verify Theme.kt
        run: |
          echo "=== Theme.kt after write ==="
          cat app/src/main/java/com/example/savetool/Theme.kt
          grep -q "fun SaveEditorTheme" app/src/main/java/com/example/savetool/Theme.kt && echo "✓ SaveEditorTheme found" || (echo "✗ MISSING" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -s gradlew ]; then
            echo "Generating wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Clean and Build Debug APK
        run: ./gradlew clean :app:assembleDebug --no-build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: save-editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: add Theme.kt with SaveEditorTheme [skip ci]"
          git push
